[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek2cherry"
version = "1.0.0"
description = "Convert DeepSeek chat exports into Cherry Studio import format"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DeepSeek2Cherry contributors" }]
keywords = ["deepseek", "cherry-studio", "chat-export", "converter"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
deepseek2cherry = "dsc2cherry.cli:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
